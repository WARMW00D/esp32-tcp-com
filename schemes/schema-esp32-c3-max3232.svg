<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker>
  </defs>
  <rect width="1100" height="580" fill="#ffffff"/>

  <text x="30" y="42" font-size="22" font-weight="700" fill="#212529">Вариант 1 — ESP32-C3 Super Mini + MAX3232</text>
  <text x="30" y="66" font-size="14" fill="#495057">MAX3232 питается от вывода 3V3 платы (штатный стабилизатор AMS1117)</text>

  <!-- USB-C -->
  <rect x="30" y="127" width="90" height="50" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="75" y="149" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">USB-C</text>
  <text x="75" y="166" font-size="12" text-anchor="middle" fill="#c92a2a">5V</text>

  <!-- ESP32-C3 board -->
  <rect x="150" y="90" width="210" height="350" rx="10" fill="#edf2ff" stroke="#364fc7" stroke-width="2"/>
  <text x="255" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#1b2a6b">ESP32-C3 Super Mini</text>
  <rect x="170" y="135" width="110" height="34" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="225" y="156" font-size="12" text-anchor="middle" fill="#5f3b00">AMS1117 3.3V</text>
  <path d="M280,152 L310,152 L310,240 L360,240" fill="none" stroke="#c92a2a" stroke-width="2"/>
  <line x1="122" y1="152" x2="166" y2="152" stroke="#c92a2a" stroke-width="2" marker-end="url(#aRed)"/>

  <circle cx="360" cy="240" r="4" fill="#fff" stroke="#364fc7" stroke-width="1.5"/>
  <circle cx="360" cy="280" r="4" fill="#fff" stroke="#364fc7" stroke-width="1.5"/>
  <circle cx="360" cy="320" r="4" fill="#fff" stroke="#364fc7" stroke-width="1.5"/>
  <circle cx="360" cy="360" r="4" fill="#fff" stroke="#364fc7" stroke-width="1.5"/>
  <text x="350" y="232" font-size="13" text-anchor="end" fill="#212529">3V3</text>
  <text x="350" y="284" font-size="13" text-anchor="end" fill="#212529">GND</text>
  <text x="350" y="324" font-size="13" text-anchor="end" fill="#212529">GPIO20 (RX1)</text>
  <text x="350" y="364" font-size="13" text-anchor="end" fill="#212529">GPIO21 (TX1)</text>
  <text x="165" y="410" font-size="12" fill="#495057">BOOT = GPIO9 (кнопка на плате)</text>
  <text x="165" y="428" font-size="12" fill="#495057">UART1: RX=GPIO20, TX=GPIO21</text>

  <!-- TTL wires -->
  <line x1="364" y1="240" x2="516" y2="240" stroke="#c92a2a" stroke-width="2"/>
  <text x="440" y="232" font-size="12" text-anchor="middle" fill="#c92a2a">3V3</text>
  <line x1="364" y1="280" x2="516" y2="280" stroke="#212529" stroke-width="2"/>
  <text x="440" y="272" font-size="12" text-anchor="middle" fill="#212529">GND</text>
  <line x1="516" y1="320" x2="366" y2="320" stroke="#1971c2" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="440" y="312" font-size="12" text-anchor="middle" fill="#1971c2">TXD → RX (GPIO20)</text>
  <line x1="364" y1="360" x2="514" y2="360" stroke="#2f9e44" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="440" y="352" font-size="12" text-anchor="middle" fill="#2f9e44">TX (GPIO21) → RXD</text>

  <!-- MAX3232 -->
  <rect x="520" y="195" width="190" height="215" rx="10" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/>
  <text x="615" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#04513b">MAX3232 (модуль)</text>
  <circle cx="520" cy="240" r="4" fill="#fff" stroke="#087f5b" stroke-width="1.5"/>
  <circle cx="520" cy="280" r="4" fill="#fff" stroke="#087f5b" stroke-width="1.5"/>
  <circle cx="520" cy="320" r="4" fill="#fff" stroke="#087f5b" stroke-width="1.5"/>
  <circle cx="520" cy="360" r="4" fill="#fff" stroke="#087f5b" stroke-width="1.5"/>
  <text x="532" y="244" font-size="13" fill="#212529">VCC</text>
  <text x="532" y="284" font-size="13" fill="#212529">GND</text>
  <text x="532" y="324" font-size="13" fill="#212529">TXD</text>
  <text x="532" y="364" font-size="13" fill="#212529">RXD</text>

  <!-- DB9 -->
  <rect x="710" y="255" width="40" height="120" rx="6" fill="#dee2e6" stroke="#495057" stroke-width="1.5"/>
  <text x="716" y="294" font-size="11" fill="#212529">2</text>
  <text x="716" y="324" font-size="11" fill="#212529">3</text>
  <text x="716" y="354" font-size="11" fill="#212529">5</text>
  <text x="730" y="392" font-size="12" text-anchor="middle" fill="#495057">DB9</text>
  <circle cx="750" cy="290" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  <circle cx="750" cy="320" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  <circle cx="750" cy="350" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>

  <!-- Cisco console cable -->
  <rect x="780" y="250" width="150" height="130" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="855" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#1864ab">Кабель Cisco console</text>
  <text x="855" y="398" font-size="12" text-anchor="middle" fill="#1864ab">DB9-F ⇄ RJ45 (rollover)</text>

  <!-- RS-232 wires -->
  <line x1="958" y1="290" x2="756" y2="290" stroke="#1971c2" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="756" y1="320" x2="958" y2="320" stroke="#2f9e44" stroke-width="2" marker-end="url(#aGreen)"/>
  <line x1="754" y1="350" x2="956" y2="350" stroke="#212529" stroke-width="2"/>
  <text x="788" y="285" font-size="11" fill="#1864ab">2 RXD</text>
  <text x="788" y="315" font-size="11" fill="#1864ab">3 TXD</text>
  <text x="788" y="345" font-size="11" fill="#1864ab">5 GND</text>
  <text x="924" y="285" font-size="11" text-anchor="end" fill="#1864ab">3 TxD</text>
  <text x="924" y="315" font-size="11" text-anchor="end" fill="#1864ab">6 RxD</text>
  <text x="924" y="345" font-size="11" text-anchor="end" fill="#1864ab">4/5 GND</text>

  <!-- Cisco device -->
  <rect x="960" y="230" width="120" height="170" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="1020" y="254" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Cisco</text>
  <text x="1020" y="271" font-size="11" text-anchor="middle" fill="#495057">Console RJ45</text>
  <text x="1020" y="372" font-size="11" text-anchor="middle" fill="#495057">коммутатор /</text>
  <text x="1020" y="386" font-size="11" text-anchor="middle" fill="#495057">роутер / AP</text>
  <circle cx="960" cy="290" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  <circle cx="960" cy="320" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  <circle cx="960" cy="350" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>

  <text x="420" y="432" font-size="12" fill="#495057">Используются только TXD / RXD / GND, линии RTS / CTS / DTR / DSR не задействованы.</text>

  <!-- Legend -->
  <line x1="30" y1="458" x2="54" y2="458" stroke="#c92a2a" stroke-width="3"/>
  <text x="60" y="462" font-size="12" fill="#343a40">питание 3.3 В</text>
  <line x1="170" y1="458" x2="194" y2="458" stroke="#212529" stroke-width="3"/>
  <text x="200" y="462" font-size="12" fill="#343a40">GND</text>
  <line x1="260" y1="458" x2="284" y2="458" stroke="#1971c2" stroke-width="3"/>
  <text x="290" y="462" font-size="12" fill="#343a40">Cisco → ESP32 (RX)</text>
  <line x1="440" y1="458" x2="464" y2="458" stroke="#2f9e44" stroke-width="3"/>
  <text x="470" y="462" font-size="12" fill="#343a40">ESP32 → Cisco (TX)</text>

  <!-- Warning -->
  <rect x="30" y="478" width="1040" height="84" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/>
  <polygon points="48,532 66,500 84,532" fill="#e03131"/>
  <text x="66" y="527" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">!</text>
  <text x="100" y="500" font-size="14" font-weight="700" fill="#c92a2a">Слабое место этой схемы — питание MAX3232 через бортовой стабилизатор AMS1117 платы.</text>
  <text x="100" y="520" font-size="13" fill="#495057">Новая партия MAX3232 с повышенным потреблением перегружает его: USB-порт то пропадает, то появляется, стабилизатор греется.</text>
  <text x="100" y="540" font-size="13" fill="#495057">Решение — отдельный понижающий модуль для MAX3232 (см. вариант 2) либо другая партия / конденсатор 470–1000 мкФ по 3V3.</text>
</svg>
