<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>

  <text x="30" y="42" font-size="22" font-weight="700" fill="#212529">Вариант 2 — ESP32-S3 Super Mini + MAX3232 + отдельный DC-DC 5V → 3.3V</text>
  <text x="30" y="66" font-size="14" fill="#495057">MAX3232 питается от отдельного понижающего модуля; бортовой стабилизатор платы нагружает только сам ESP32-S3</text>

  <!-- USB-C -->
  <rect x="30" y="127" width="90" height="50" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="75" y="149" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">USB-C</text>
  <text x="75" y="166" font-size="12" text-anchor="middle" fill="#c92a2a">5V</text>

  <!-- ESP32-S3 board -->
  <rect x="150" y="80" width="210" height="360" rx="10" fill="#edf2ff" stroke="#364fc7" stroke-width="2"/>
  <text x="255" y="102" font-size="15" font-weight="700" text-anchor="middle" fill="#1b2a6b">ESP32-S3 Super Mini</text>
  <path d="M166,152 L310,152 L310,130 L360,130" fill="none" stroke="#c92a2a" stroke-width="2"/>
  <line x1="240" y1="152" x2="240" y2="175" stroke="#c92a2a" stroke-width="2"/>
  <line x1="122" y1="152" x2="166" y2="152" stroke="#c92a2a" stroke-width="2" marker-end="url(#aRed)"/>
  <rect x="170" y="175" width="140" height="32" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="240" y="195" font-size="11" text-anchor="middle" fill="#5f3b00">LDO 3.3V (ESP32-S3)</text>

  <circle cx="360" cy="130" r="4" fill="#fff" stroke="#364fc7" stroke-width="1.5"/>
  <circle cx="360" cy="175" r="4" fill="#fff" stroke="#364fc7" stroke-width="1.5"/>
  <circle cx="360" cy="225" r="4" fill="#fff" stroke="#9aa0a6" stroke-width="1.5"/>
  <circle cx="360" cy="330" r="4" fill="#fff" stroke="#364fc7" stroke-width="1.5"/>
  <circle cx="360" cy="365" r="4" fill="#fff" stroke="#364fc7" stroke-width="1.5"/>
  <text x="350" y="122" font-size="13" text-anchor="end" fill="#212529">5V (VBUS)</text>
  <text x="350" y="179" font-size="13" text-anchor="end" fill="#212529">GND</text>
  <text x="350" y="229" font-size="12" text-anchor="end" fill="#868e96">3V3 — не используется</text>
  <text x="350" y="334" font-size="13" text-anchor="end" fill="#212529">GPIO17 (RX1)</text>
  <text x="350" y="369" font-size="13" text-anchor="end" fill="#212529">GPIO18 (TX1)</text>
  <text x="165" y="405" font-size="12" fill="#495057">BOOT = GPIO0 (на плате)</text>
  <text x="165" y="423" font-size="12" fill="#495057">UART1: RX = GPIO17, TX = GPIO18</text>

  <!-- 5V and GND to DC-DC -->
  <line x1="364" y1="130" x2="426" y2="130" stroke="#c92a2a" stroke-width="2"/>
  <text x="395" y="122" font-size="12" text-anchor="middle" fill="#c92a2a">5V</text>
  <line x1="364" y1="175" x2="426" y2="175" stroke="#212529" stroke-width="2"/>
  <text x="395" y="167" font-size="12" text-anchor="middle" fill="#212529">GND</text>

  <!-- DC-DC module -->
  <rect x="430" y="95" width="170" height="125" rx="10" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
  <text x="515" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#7a4100">DC-DC 5V → 3.3V</text>
  <circle cx="430" cy="130" r="4" fill="#fff" stroke="#e67700" stroke-width="1.5"/>
  <circle cx="430" cy="175" r="4" fill="#fff" stroke="#e67700" stroke-width="1.5"/>
  <circle cx="600" cy="130" r="4" fill="#fff" stroke="#e67700" stroke-width="1.5"/>
  <circle cx="600" cy="175" r="4" fill="#fff" stroke="#e67700" stroke-width="1.5"/>
  <text x="440" y="134" font-size="12" fill="#212529">IN+</text>
  <text x="440" y="179" font-size="12" fill="#212529">IN−</text>
  <text x="590" y="134" font-size="12" text-anchor="end" fill="#212529">OUT+</text>
  <text x="590" y="179" font-size="12" text-anchor="end" fill="#212529">OUT−</text>
  <text x="515" y="205" font-size="11" text-anchor="middle" fill="#495057">выход 3.3 В, ≥ 500 мА</text>

  <!-- DC-DC output to MAX3232 power pins -->
  <path d="M604,130 H625 V260 H636" fill="none" stroke="#c92a2a" stroke-width="2"/>
  <path d="M604,175 H612 V295 H636" fill="none" stroke="#212529" stroke-width="2"/>
  <text x="634" y="205" font-size="12" fill="#c92a2a">3.3V</text>

  <!-- TTL signal wires -->
  <line x1="636" y1="330" x2="366" y2="330" stroke="#1971c2" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="500" y="322" font-size="12" text-anchor="middle" fill="#1971c2">TXD → GPIO17 (RX)</text>
  <line x1="364" y1="365" x2="634" y2="365" stroke="#2f9e44" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="500" y="357" font-size="12" text-anchor="middle" fill="#2f9e44">GPIO18 (TX) → RXD</text>

  <!-- MAX3232 -->
  <rect x="640" y="225" width="180" height="185" rx="10" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/>
  <text x="730" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#04513b">MAX3232 (модуль)</text>
  <circle cx="640" cy="260" r="4" fill="#fff" stroke="#087f5b" stroke-width="1.5"/>
  <circle cx="640" cy="295" r="4" fill="#fff" stroke="#087f5b" stroke-width="1.5"/>
  <circle cx="640" cy="330" r="4" fill="#fff" stroke="#087f5b" stroke-width="1.5"/>
  <circle cx="640" cy="365" r="4" fill="#fff" stroke="#087f5b" stroke-width="1.5"/>
  <text x="652" y="264" font-size="13" fill="#212529">VCC</text>
  <text x="652" y="299" font-size="13" fill="#212529">GND</text>
  <text x="652" y="334" font-size="13" fill="#212529">TXD</text>
  <text x="652" y="369" font-size="13" fill="#212529">RXD</text>
  <text x="730" y="398" font-size="11" text-anchor="middle" fill="#495057">+ 100 нФ у VCC</text>

  <!-- DB9 -->
  <rect x="820" y="265" width="40" height="120" rx="6" fill="#dee2e6" stroke="#495057" stroke-width="1.5"/>
  <text x="826" y="304" font-size="11" fill="#212529">2</text>
  <text x="826" y="334" font-size="11" fill="#212529">3</text>
  <text x="826" y="364" font-size="11" fill="#212529">5</text>
  <text x="840" y="402" font-size="12" text-anchor="middle" fill="#495057">DB9</text>
  <circle cx="860" cy="300" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  <circle cx="860" cy="330" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  <circle cx="860" cy="360" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>

  <!-- Cisco console cable -->
  <rect x="890" y="260" width="130" height="130" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="955" y="248" font-size="12" font-weight="700" text-anchor="middle" fill="#1864ab">Кабель Cisco console</text>
  <text x="955" y="408" font-size="12" text-anchor="middle" fill="#1864ab">DB9-F ⇄ RJ45 (rollover)</text>

  <!-- RS-232 wires -->
  <line x1="1048" y1="300" x2="866" y2="300" stroke="#1971c2" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="866" y1="330" x2="1048" y2="330" stroke="#2f9e44" stroke-width="2" marker-end="url(#aGreen)"/>
  <line x1="864" y1="360" x2="1046" y2="360" stroke="#212529" stroke-width="2"/>
  <text x="896" y="295" font-size="11" fill="#1864ab">2 RXD</text>
  <text x="896" y="325" font-size="11" fill="#1864ab">3 TXD</text>
  <text x="896" y="355" font-size="11" fill="#1864ab">5 GND</text>
  <text x="1014" y="295" font-size="11" text-anchor="end" fill="#1864ab">3 TxD</text>
  <text x="1014" y="325" font-size="11" text-anchor="end" fill="#1864ab">6 RxD</text>
  <text x="1014" y="355" font-size="11" text-anchor="end" fill="#1864ab">4/5 GND</text>

  <!-- Cisco device -->
  <rect x="1050" y="245" width="120" height="170" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="1110" y="268" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Cisco</text>
  <text x="1110" y="285" font-size="11" text-anchor="middle" fill="#495057">Console RJ45</text>
  <text x="1110" y="386" font-size="11" text-anchor="middle" fill="#495057">коммутатор /</text>
  <text x="1110" y="400" font-size="11" text-anchor="middle" fill="#495057">роутер / AP</text>
  <circle cx="1050" cy="300" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  <circle cx="1050" cy="330" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>
  <circle cx="1050" cy="360" r="4" fill="#fff" stroke="#495057" stroke-width="1.5"/>

  <!-- Legend -->
  <line x1="30" y1="466" x2="54" y2="466" stroke="#c92a2a" stroke-width="3"/>
  <text x="60" y="470" font-size="12" fill="#343a40">питание</text>
  <line x1="150" y1="466" x2="174" y2="466" stroke="#212529" stroke-width="3"/>
  <text x="180" y="470" font-size="12" fill="#343a40">GND</text>
  <line x1="240" y1="466" x2="264" y2="466" stroke="#1971c2" stroke-width="3"/>
  <text x="270" y="470" font-size="12" fill="#343a40">Cisco → ESP32 (RX)</text>
  <line x1="420" y1="466" x2="444" y2="466" stroke="#2f9e44" stroke-width="3"/>
  <text x="450" y="470" font-size="12" fill="#343a40">ESP32 → Cisco (TX)</text>

  <!-- Notes -->
  <rect x="30" y="490" width="1140" height="105" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text x="50" y="514" font-size="14" font-weight="700" fill="#212529">Важно</text>
  <text x="50" y="536" font-size="13" fill="#343a40">• Выход DC-DC — строго 3.3 В: логика MAX3232 работает на уровне его VCC, а GPIO ESP32-S3 не терпят 5 В.</text>
  <text x="50" y="556" font-size="13" fill="#343a40">• GND общий у платы, DC-DC и MAX3232 — обязательно. При сомнениях свяжите GND платы и GND MAX3232 отдельным проводом.</text>
  <text x="50" y="576" font-size="13" fill="#343a40">• Желательно 100 нФ керамика у VCC MAX3232 и 470 мкФ электролит на выходе DC-DC. Пины UART и BOOT сверьте с шёлкографией платы.</text>
</svg>
